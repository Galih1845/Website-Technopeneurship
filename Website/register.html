<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar Akun Baru — Elvora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="register-page">
  <header class="register-header">
    <a href="javascript:history.back()" class="back-link">←</a>
    <div class="register-title">Daftar Akun Baru</div>
  </header>

  <main class="register-container">
    <div class="progress-line">
      <span class="progress-step active"></span>
      <span class="progress-track" style="--fill:0%"></span>
    </div>

    <form id="register-form" class="register-form">
      <!-- Step 1: Akun Dasar -->
      <div class="step" data-step="1">
        <h3 class="step-title">Akun Dasar</h3>
        <p class="step-desc">Isi data dasar untuk membuat akun</p>
        <label class="field-label" for="full-name">Nama lengkap</label>
        <input id="full-name" name="fullName" type="text" placeholder="Nama lengkap sesuai KTP" required>

        <label class="field-label" for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" placeholder="Email" required>

        <label class="field-label" for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" placeholder="Buat kata sandi" required>

        <label class="field-label" for="reg-phone">Nomor HP (OTP)</label>
        <input id="reg-phone" name="phone" type="tel" placeholder="0812xxxx" required>

        <div class="form-actions space-between">
          <div></div>
          <button type="button" class="btn btn-primary" data-action="next">Lanjutkan</button>
        </div>
      </div>

      <!-- Step 2: Informasi Pribadi -->
      <div class="step hidden" data-step="2">
        <h3 class="step-title">Informasi Pribadi</h3>
        <label class="field-label" for="birthdate">Tanggal lahir</label>
        <input id="birthdate" name="birthdate" type="date" required>

        <label class="field-label" for="address">Alamat lengkap</label>
        <input id="address" name="address" type="text" placeholder="Jalan, RT/RW, Kecamatan, Kota" required>

        <label class="field-label" for="job-status">Status pekerjaan</label>
        <input id="job-status" name="jobStatus" type="text" placeholder="Pekerjaan saat ini" required>

        <div class="form-actions space-between">
          <button type="button" class="btn btn-outline" data-action="back">Kembali</button>
          <button type="button" class="btn btn-primary" data-action="next">Lanjutkan</button>
        </div>
      </div>

      <!-- Step 3: Identitas (KYC) -->
      <div class="step hidden" data-step="3">
        <h3 class="step-title">Identitas (KYC)</h3>
        <label class="field-label" for="ktp-number">Nomor KTP</label>
        <input id="ktp-number" name="ktpNumber" type="text" placeholder="1234567890123456" required>

        <label class="field-label" for="ktp-file">Upload KTP (foto/jpg/png)</label>
        <input id="ktp-file" name="ktpFile" type="file" accept="image/*" required>

        <label class="field-label" for="selfie-ktp">Upload selfie dengan KTP</label>
        <input id="selfie-ktp" name="selfieKtp" type="file" accept="image/*" required>

        <div class="form-actions space-between">
          <button type="button" class="btn btn-outline" data-action="back">Kembali</button>
          <button type="button" class="btn btn-primary" data-action="next">Lanjutkan</button>
        </div>
      </div>

      <!-- Step 4: Informasi Keuangan -->
      <div class="step hidden" data-step="4">
        <h3 class="step-title">Informasi Keuangan</h3>
        <label class="field-label" for="bank-account">Nomor rekening bank</label>
        <input id="bank-account" name="bankAccount" type="text" placeholder="1234567890" required>

        <label class="field-label" for="bank-name">Nama pemilik rekening</label>
        <input id="bank-name" name="bankName" type="text" placeholder="Nama pemilik rekening" required>

        <label class="field-label" for="income">Penghasilan</label>
        <input id="income" name="income" type="text" placeholder="Per tahun / per bulan" required>

        <label class="field-label" for="risk-profile">Profil risiko</label>
        <select id="risk-profile" name="riskProfile" required>
          <option value="">Pilih profil risiko</option>
          <option value="conservative">Konservatif</option>
          <option value="balanced">Seimbang</option>
          <option value="aggressive">Agresif</option>
        </select>

        <div class="form-actions space-between">
          <button type="button" class="btn btn-outline" data-action="back">Kembali</button>
          <button type="submit" class="btn btn-primary" id="reg-submit">Selesaikan Pendaftaran</button>
        </div>
      </div>
      <div class="register-feedback" id="register-feedback" aria-live="polite"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
